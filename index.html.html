<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Family Hub</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#f3f0e9;color:#25231f}
*{box-sizing:border-box}
.app{padding:20px}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
h1{margin:0;font-size:32px}
.sub{color:#777;margin-top:4px}
.clock{font-size:28px;font-weight:bold;text-align:right}
.date{font-size:13px;color:#777}
.tabs{display:flex;gap:8px;background:#e6e1d9;padding:6px;border-radius:14px;margin-bottom:18px;overflow:auto}
.tab{border:0;background:transparent;padding:10px 16px;border-radius:10px;font-weight:bold;color:#777;white-space:nowrap}
.tab.active{background:#fff;color:#222}
.view{display:none}
.view.active{display:block}
.card{background:#fffdf9;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{border:1px solid #ddd5ca;border-radius:12px;padding:10px;min-height:240px;background:#fff}
.day h3{font-size:13px;margin:0 0 8px}
.event{padding:7px;margin-bottom:6px;border-radius:8px;font-size:12px}
.mom{background:#f7dde4;border-left:4px solid #c77b8d}
.dad{background:#dfe8f5;border-left:4px solid #6888b1}
.julie{background:#eadff1;border-left:4px solid #9b7bb8}
.cynthia{background:#f7e7d7;border-left:4px solid #d8995b}
.addEvent{width:100%;margin-top:6px;border:1px dashed #bbb;background:#fafafa;border-radius:8px;padding:7px}
.controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
input,select,textarea{padding:10px;border:1px solid #d8d1c7;border-radius:10px;font-size:16px}
input[type=text]{flex:1;min-width:180px}
button.primary{background:#566e60;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:bold}
button.secondary{background:#eee9e1;border:0;border-radius:10px;padding:10px 14px}
ul{list-style:none;padding:0;margin:0}
li.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
li.done span{text-decoration:line-through;color:#aaa}
li.item span{flex:1}
.delete{border:0;background:transparent;font-size:18px;color:#9a8176}
.meals{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.meal{border:1px solid #ddd5ca;border-radius:12px;padding:10px;background:#fff}
.meal strong{display:block;font-size:13px;margin-bottom:7px}
.meal textarea{width:100%;height:130px;border:0;padding:0;resize:none}
.personbar{display:flex;gap:8px;margin-bottom:16px;overflow:auto}
.person{border:2px solid transparent;background:#fff;padding:8px 12px;border-radius:999px;font-weight:bold;white-space:nowrap}
.person.active{border-color:#566e60}
.modal{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.3);align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modalbox{background:#fff;border-radius:16px;padding:18px;width:95%;max-width:600px}
.formrow{display:flex;gap:8px;flex-wrap:wrap}
.formrow input,.formrow select{flex:1;min-width:120px}
.notice{font-size:13px;color:#777;line-height:1.5}
@media(max-width:900px){
 .week,.meals{grid-template-columns:repeat(2,1fr)}
 .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div><h1>Family Hub</h1><div class="sub">Calendar · To-do · Meal Plan · Shopping</div></div>
    <div><div class="clock" id="clock"></div><div class="date" id="date"></div></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('calendar',this)">Calendar</button>
    <button class="tab" onclick="switchTab('todo',this)">To-do</button>
    <button class="tab" onclick="switchTab('meal',this)">Meal Plan</button>
  </div>

  <div class="personbar">
    <button class="person active" onclick="setFilter('all',this)">Everyone</button>
    <button class="person" onclick="setFilter('mom',this)">Mom</button>
    <button class="person" onclick="setFilter('dad',this)">Dad</button>
    <button class="person" onclick="setFilter('julie',this)">Julie</button>
    <button class="person" onclick="setFilter('cynthia',this)">Cynthia</button>
  </div>

  <div id="calendar" class="view active">
    <div class="card">
      <div class="controls">
        <button class="primary" onclick="openModal()">+ Add Event</button>
      </div>
      <div id="week" class="week"></div>
    </div>
  </div>

  <div id="todo" class="view">
    <div class="grid">
      <div class="card">
        <h2>Family To-do</h2>
        <div class="controls">
          <input id="todoText" type="text" placeholder="Add a task">
          <select id="todoPerson">
            <option value="mom">Mom</option>
            <option value="dad">Dad</option>
            <option value="julie">Julie</option>
            <option value="cynthia">Cynthia</option>
          </select>
          <button class="primary" onclick="addTodo()">Add</button>
        </div>
        <ul id="todoList"></ul>
      </div>
      <div class="card">
        <h2>How it works</h2>
        <div class="notice">Items are saved on this iPad using Safari local storage.</div>
      </div>
    </div>
  </div>

  <div id="meal" class="view">
    <div class="grid">
      <div class="card">
        <h2>Weekly Meal Plan</h2>
        <div id="meals" class="meals"></div>
      </div>
      <div class="card">
        <h2>Shopping List</h2>
        <div class="controls">
          <input id="shopText" type="text" placeholder="Add grocery item">
          <button class="primary" onclick="addShop()">Add</button>
        </div>
        <ul id="shopList"></ul>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="eventModal">
  <div class="modalbox">
    <h2>Add Event</h2>
    <div class="formrow">
      <input id="eventTitle" type="text" placeholder="Event name">
      <input id="eventDate" type="date">
      <input id="eventTime" type="time">
      <select id="eventPerson">
        <option value="mom">Mom</option>
        <option value="dad">Dad</option>
        <option value="julie">Julie</option>
        <option value="cynthia">Cynthia</option>
      </select>
    </div>
    <div class="controls" style="margin-top:12px">
      <button class="primary" onclick="saveEvent()">Save</button>
      <button class="secondary" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
var currentFilter='all';
var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function byId(id){return document.getElementById(id);}
function storageGet(key, fallback){
  var s=localStorage.getItem(key);
  if(!s){return fallback;}
  try{return JSON.parse(s);}catch(e){return fallback;}
}
function storageSet(key,val){localStorage.setItem(key,JSON.stringify(val));}
function htmlEscape(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];
  });
}
function updateClock(){
  var d=new Date();
  byId('clock').innerHTML=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  byId('date').innerHTML=d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric',year:'numeric'});
}
updateClock();
setInterval(updateClock,30000);

function switchTab(id,btn){
  var views=document.getElementsByClassName('view');
  var i;
  for(i=0;i<views.length;i++){views[i].className='view';}
  byId(id).className='view active';

  var tabs=document.getElementsByClassName('tab');
  for(i=0;i<tabs.length;i++){tabs[i].className='tab';}
  btn.className='tab active';
}

function setFilter(person,btn){
  currentFilter=person;
  var ps=document.getElementsByClassName('person');
  var i;
  for(i=0;i<ps.length;i++){ps[i].className='person';}
  btn.className='person active';
  renderCalendar();
  renderTodos();
}

function formatDate(d){
  var y=d.getFullYear();
  var m=('0'+(d.getMonth()+1)).slice(-2);
  var day=('0'+d.getDate()).slice(-2);
  return y+'-'+m+'-'+day;
}
function weekDates(){
  var now=new Date();
  var start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-now.getDay());
  var arr=[];
  var i,d;
  for(i=0;i<7;i++){
    d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    arr.push(d);
  }
  return arr;
}
function personName(id){
  return {mom:'Mom',dad:'Dad',julie:'Julie',cynthia:'Cynthia'}[id] || id;
}
function renderCalendar(){
  var events=storageGet('family_events',[]);
  var week=weekDates();
  var out='',i,j,d,ds,e;
  for(i=0;i<week.length;i++){
    d=week[i]; ds=formatDate(d);
    out+='<div class="day"><h3>'+days[i]+' '+(d.getMonth()+1)+'/'+d.getDate()+'</h3>';
    for(j=0;j<events.length;j++){
      e=events[j];
      if(e.date===ds && (currentFilter==='all'||e.person===currentFilter)){
        out+='<div class="event '+e.person+'"><b>'+htmlEscape(e.title)+'</b><br>'+
          (e.time?htmlEscape(e.time)+' · ':'')+personName(e.person)+
          ' <button class="delete" onclick="deleteEvent('+e.id+')">×</button></div>';
      }
    }
    out+='<button class="addEvent" onclick="openModal(\''+ds+'\')">+ Add</button></div>';
  }
  byId('week').innerHTML=out;
}
function openModal(date){
  byId('eventModal').className='modal show';
  byId('eventDate').value=date||formatDate(new Date());
}
function closeModal(){byId('eventModal').className='modal';}
function saveEvent(){
  var title=byId('eventTitle').value;
  var date=byId('eventDate').value;
  if(!title||!date){alert('Please enter an event name and date.');return;}
  var arr=storageGet('family_events',[]);
  arr.push({id:new Date().getTime(),title:title,date:date,time:byId('eventTime').value,person:byId('eventPerson').value});
  storageSet('family_events',arr);
  byId('eventTitle').value='';
  byId('eventTime').value='';
  closeModal();
  renderCalendar();
}
function deleteEvent(id){
  var arr=storageGet('family_events',[]);
  var next=[],i;
  for(i=0;i<arr.length;i++){if(arr[i].id!==id){next.push(arr[i]);}}
  storageSet('family_events',next);
  renderCalendar();
}

function addTodo(){
  var text=byId('todoText').value;
  if(!text){return;}
  var arr=storageGet('family_todos',[]);
  arr.push({id:new Date().getTime(),text:text,person:byId('todoPerson').value,done:false});
  storageSet('family_todos',arr);
  byId('todoText').value='';
  renderTodos();
}
function toggleTodo(id){
  var arr=storageGet('family_todos',[]),i;
  for(i=0;i<arr.length;i++){if(arr[i].id===id){arr[i].done=!arr[i].done;}}
  storageSet('family_todos',arr);renderTodos();
}
function deleteTodo(id){
  var arr=storageGet('family_todos',[]),next=[],i;
  for(i=0;i<arr.length;i++){if(arr[i].id!==id){next.push(arr[i]);}}
  storageSet('family_todos',next);renderTodos();
}
function renderTodos(){
  var arr=storageGet('family_todos',[]);
  var out='',i,x;
  for(i=0;i<arr.length;i++){
    x=arr[i];
    if(currentFilter==='all'||x.person===currentFilter){
      out+='<li class="item '+(x.done?'done':'')+'"><input type="checkbox" '+(x.done?'checked':'')+
        ' onclick="toggleTodo('+x.id+')"><span>'+htmlEscape(x.text)+' ('+personName(x.person)+')</span>'+
        '<button class="delete" onclick="deleteTodo('+x.id+')">×</button></li>';
    }
  }
  byId('todoList').innerHTML=out;
}

function renderMeals(){
  var out='',i;
  for(i=0;i<7;i++){
    out+='<div class="meal"><strong>'+days[i]+'</strong><textarea id="meal'+i+'" onkeyup="saveMeal('+i+')" placeholder="Breakfast\nLunch\nDinner"></textarea></div>';
  }
  byId('meals').innerHTML=out;
  for(i=0;i<7;i++){byId('meal'+i).value=localStorage.getItem('meal_'+i)||'';}
}
function saveMeal(i){localStorage.setItem('meal_'+i,byId('meal'+i).value);}

function addShop(){
  var text=byId('shopText').value;if(!text){return;}
  var arr=storageGet('family_shop',[]);
  arr.push({id:new Date().getTime(),text:text,done:false});
  storageSet('family_shop',arr);byId('shopText').value='';renderShop();
}
function toggleShop(id){
  var arr=storageGet('family_shop',[]),i;
  for(i=0;i<arr.length;i++){if(arr[i].id===id){arr[i].done=!arr[i].done;}}
  storageSet('family_shop',arr);renderShop();
}
function deleteShop(id){
  var arr=storageGet('family_shop',[]),next=[],i;
  for(i=0;i<arr.length;i++){if(arr[i].id!==id){next.push(arr[i]);}}
  storageSet('family_shop',next);renderShop();
}
function renderShop(){
  var arr=storageGet('family_shop',[]),out='',i,x;
  for(i=0;i<arr.length;i++){
    x=arr[i];
    out+='<li class="item '+(x.done?'done':'')+'"><input type="checkbox" '+(x.done?'checked':'')+
      ' onclick="toggleShop('+x.id+')"><span>'+htmlEscape(x.text)+'</span>'+
      '<button class="delete" onclick="deleteShop('+x.id+')">×</button></li>';
  }
  byId('shopList').innerHTML=out;
}

renderCalendar();renderTodos();renderMeals();renderShop();
</script>
</body>
</html>
